[project]
name = "chemtrend"
version = "0.1.0"
description = ""
authors = [{ name = "CindyvdVries", email = "cindyvdvries@gmail.com" }]
requires-python = ">=3.14,<3.15"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi[standard]>=0.112.0,<0.113",
    "sqlalchemy>=2.0.32,<3",
    "psycopg[binary]>=3.2.0,<4",
    "databases>=0.9.0,<0.10",
    "asyncpg>=0.31.0,<0.32",
    "configparser>=7.0.0,<8",
    "geoalchemy2>=0.15.2,<0.16",
    "certifi>=2026.10.19,<2027",
]

[tool.uv]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
